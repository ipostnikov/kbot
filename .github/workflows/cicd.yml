name: KBOT-CICD

on:
  push:
    paths-ignore:
      - 'helm/values.yaml'

env:
  TARGETARCH: amd64
  TARGETOS: linux

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set VERSION environment variable
        run: |
          VERSION_TAG=$(git describe --tags --abbrev=0 || echo "0.0.0") # get the tag with fallback
          COMMIT_SHORT_SHA=$(git rev-parse --short HEAD) # short SHA commit
          # forming a version string using ENVs
          echo "VERSION=$VERSION_TAG-$COMMIT_SHORT_SHA-${{ env.TARGETOS }}" >> $GITHUB_ENV

      - name: Run test
        run: make test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_GITHUB_TOKEN }}

      - name: Build&push
        env:
          APP: "kbot"
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          make image push \
            TARGETARCH=${{ env.TARGETARCH }} \
            TARGETOS=${{ env.TARGETOS }} \
            VERSION=${{ env.VERSION }}

  cd:
    name: CD
    needs: ci
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        token: ${{ secrets.GHCR_GITHUB_TOKEN }}

    - name: Update Helm chart
      uses: mikefarah/yq@master
      with:
        cmd: yq -i '.image.tag=strenv(VERSION) | .image.arch=strenv(TARGETARCH)' helm/values.yaml

    - name: Commit and Push updated values.yaml
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add helm/values.yaml
        git commit -m "update version ${{ env.VERSION }}" || echo "No changes to commit"
        git push
