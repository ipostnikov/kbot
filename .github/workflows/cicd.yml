name: KBOT-CICD

on:
  push:
    paths-ignore:
      - 'helm/values.yaml'

env:
  TARGETARCH: amd64
  TARGETOS: linux

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set VERSION environment variable
        run: |
          VERSION_TAG=$(git describe --tags --abbrev=0 || echo "0.0.0")
          COMMIT_SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=$VERSION_TAG-$COMMIT_SHORT_SHA" >> $GITHUB_ENV

      - name: Run test
        run: make test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build&push
        env:
          APP: "kbot"
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          make image push \
            TARGETARCH=${{ env.TARGETARCH }} \
            TARGETOS=${{ env.TARGETOS }} \
            VERSION=${{ env.VERSION }}

  cd:
    name: CD
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - run: echo "VERSION=$(git describe --tags --abbrev=0)-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Update Helm chart
      uses: mikefarah/yq@master
      with:
        cmd: yq -i '.image.tag=strenv(VERSION) | .image.arch=strenv(TARGETARCH)' helm/values.yaml

    - name: Commit and Push updated values.yaml
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add helm/values.yaml
        git commit -m "update version $VERSION" || echo "No changes to commit"
        git push
