services:
  kbot:
    build: .
    environment:
      - TELE_TOKEN=${TELE_TOKEN}
      # Optional: cookies file (Netscape format) for login-gated content.
      - COOKIES_FILE=${COOKIES_FILE:-}
    restart: unless-stopped
    # Uncomment if you use cookies (see README):
    # volumes:
    #   - ./cookies.txt:/cookies.txt:ro
