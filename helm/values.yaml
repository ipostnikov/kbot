# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
image:
  registry: "ghcr.io"
  repository: "ipostnikov/kbot"
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # tag: "v1.3.0-e128987"
  tag: "v1.18.0-a403e16"
  # arch: "amd64"
  # os: linux

  arch: amd64
imagePullSecrets:
  - name: ghcr-secret
secret:
  name: tg-secret
  key: token
  env: TELE_TOKEN
securityContext:
  privileged: true
